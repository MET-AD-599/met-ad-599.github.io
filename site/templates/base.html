<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}AD 599{% endblock %}</title>
<style>
  :root {
    --bg: #f7f7f5; --card: #ffffff; --ink: #1c1c1c; --muted: #6b6b6b;
    --line: #e4e2dc; --accent: #cc0000; --accent-ink: #ffffff;
    --c1: #3b6fd1; --c2: #e0913b; --c3: #4caf7d; --c4: #9b59b6; --c5: #7f8c8d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
  .wide { max-width: 1180px; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  header h1 { font-size: 1.35rem; margin: 0; }
  header .course { color: var(--muted); font-size: .9rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
          padding: 20px; margin: 14px 0; }
  label.q { display: block; font-weight: 600; margin: 18px 0 6px; }
  label.q .hint { font-weight: 400; color: var(--muted); font-size: .9rem; }
  input[type=text], input[type=email], input[type=password], input[type=number], select, textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
    font: inherit; background: #fff; }
  textarea { min-height: 72px; resize: vertical; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row > * { flex: 1 1 180px; }
  .scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .scale label { text-align: center; border: 1px solid var(--line); border-radius: 8px;
                 padding: 8px 0; cursor: pointer; background: #fff; }
  .scale input { display: none; }
  .scale input:checked + span { display: block; background: var(--ink); color: #fff;
                                border-radius: 6px; margin: -8px 0; padding: 8px 0; }
  button.primary { background: var(--accent); color: var(--accent-ink); border: 0;
                   border-radius: 10px; padding: 14px 22px; font: inherit; font-weight: 700;
                   width: 100%; margin-top: 24px; cursor: pointer; }
  .muted { color: var(--muted); }
  .tag { display: inline-block; font-size: .72rem; font-weight: 700; letter-spacing: .04em;
         text-transform: uppercase; color: #fff; padding: 2px 8px; border-radius: 999px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; }
  .panel h2 { font-size: 1.05rem; margin: 6px 0 2px; }
  .panel .why { color: var(--muted); font-size: .88rem; margin: 0 0 10px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
  .tile { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .tile .v { font-size: 1.6rem; font-weight: 700; line-height: 1.1; }
  .tile .k { color: var(--muted); font-size: .8rem; }
  pre { background: #1c1c1c; color: #eaeaea; padding: 12px 14px; border-radius: 8px;
        font-size: .82rem; overflow-x: auto; margin: 8px 0; }
  table { border-collapse: collapse; width: 100%; font-size: .9rem; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  ul.qs { padding-left: 18px; margin: 0; }
  @media (max-width: 700px) { ul.qs { columns: 1 !important; } }
  ul.qs li { margin: 4px 0; }
  .chips span { display: inline-block; background: #eee; border-radius: 6px;
                padding: 2px 8px; margin: 3px 4px 3px 0; font-family: ui-monospace, monospace; font-size: .85rem; }
  .plot { width: 100%; height: 260px; }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 6px 0 12px; }
  .toolbar a { color: var(--ink); }
  .big { font-size: 2.4rem; font-weight: 800; }
  table.kv th { width: 40%; color: var(--muted); font-weight: 600; vertical-align: top; }
  .btn { display: inline-block; background: var(--ink); color: #fff; border: 0; border-radius: 8px;
         padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; }
  .btn.danger { background: var(--accent); }
  button.link { background: none; border: 0; color: var(--ink); text-decoration: underline; cursor: pointer; font: inherit; padding: 0; }
  button.link.danger { color: var(--accent); }
  .pill { display: inline-block; font-size: .75rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: #e4e2dc; }
  .pill.ok { background: #d9efe2; color: #1f5c3a; }
  .flash { background: #fff4d6; border: 1px solid #f0d58a; border-radius: 8px; padding: 8px 12px; }
  .actions a, .actions form { margin-right: 10px; }
  @media print { .noprint, .topnav { display: none; } .card { break-inside: avoid; border: 0; } body { background: #fff; } }
  .topnav { font-size: .85rem; color: var(--muted); margin-bottom: 6px; }
  .topnav a { color: var(--muted); text-decoration: none; font-weight: 600; }
  .lect { display: block; padding: 14px 18px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); text-decoration: none; margin: 10px 0; }
  .lect:hover { border-color: var(--ink); }
  .lect small { display: block; color: var(--muted); }
</style>
{% block head %}{% endblock %}
</head>
<body>
<div class="wrap {% block wrapclass %}{% endblock %}">
<nav class="topnav"><a href="{{ url_for('index') }}">AD 599</a>{% if student %} · {{ student.nickname or student.first_name or student.username }} · <a href="{{ url_for('auth.logout') }}">sign out</a>{% elif not is_admin %} · <a href="{{ url_for('auth.login') }}">sign in</a>{% endif %}{% if is_admin %} · <a href="{{ url_for('admin.overview') }}">admin</a>{% if not student %} · <a href="{{ url_for('admin.logout') }}">instructor sign out</a>{% endif %}{% endif %}</nav>
{% block body %}{% endblock %}
</div>
</body>
</html>
