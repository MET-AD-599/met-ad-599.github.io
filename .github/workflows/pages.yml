# Publishes site/ to https://met-ad-599.github.io/ on every push to main.
# One-time setup: this repo must be PUBLIC, and Settings > Pages > Build and deployment > Source: "GitHub Actions".
# The site source lives in the private ad599-app repo (prod/site); publish_site.bat copies it here and pushes.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build
        env:
          BASE: ${{ vars.PAGES_BASE || '/' }}
        run: sh site/build.sh "$BASE" "${GITHUB_SHA::8}" _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
