{% extends "base.html" %}
{% block title %}AD 599 · Sign in{% endblock %}
{% block body %}
<header><h1>Sign in</h1><span class="course">{{ course }}</span></header>
<form class="card" method="post" autocomplete="off">
  {% set m = get_flashed_messages() %}{% if m %}<p class="flash">{{ m[0] }}</p>{% endif %}
  <label class="q" for="username">BU username <span class="hint">(with or without @bu.edu)</span></label>
  <input type="text" id="username" name="username" value="{{ username }}" placeholder="jdoe" autofocus required
         autocapitalize="none" spellcheck="false">
  <label class="q" for="password">Password <span class="hint">(from your instructor)</span></label>
  <input type="password" id="password" name="password" required>
  <button class="primary" type="submit">Sign in</button>
</form>
{% endblock %}
